[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlcore"
version = "1.0.0"
description = "A modular reinforcement learning research platform: legible algorithms on shared, tested infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "rlcore contributors" }]
keywords = ["reinforcement-learning", "research", "pytorch", "gymnasium"]
dependencies = [
    "torch>=2.2",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "hydra-core>=1.3",
    "matplotlib>=3.8",
]

[project.scripts]
rlcore-train = "rlcore.cli:train_main"
rlcore-evaluate = "rlcore.cli:evaluate_main"
rlcore-benchmark = "rlcore.cli:benchmark_main"
rlcore-research = "rlcore.research.cli:research_main"
rlcore-lab = "rlcore.lab.server:lab_main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
]
# Verification-only dependency (ARCHITECTURE.md §7): SB3 is used exclusively by
# tests/parity and must never be imported from src/rlcore.
parity = [
    "stable-baselines3>=2.4",
]
# Optional tracker backends (ARCHITECTURE §6.7): local tracking never needs
# these, and no credentials are required even with them installed.
track = [
    "wandb>=0.17",
    "mlflow>=2.14",
]
# Research layer optionals (ARCHITECTURE §8): PDF ingestion and the
# Anthropic provider. The layer works without them (Markdown/text +
# MockProvider); no API key is ever required or stored.
research = [
    "pypdf>=5.0",
    "anthropic>=0.40",
]
# Docs build (CI docs job): plain mkdocs, strict mode.
docs = [
    "mkdocs>=1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rlcore"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RET", # return statements
    "ANN", # type annotations required
    "D",   # docstrings required
    "RUF", # ruff-specific
    "T20", # no stray print in library code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D1"] # tests: docstrings optional, annotations still required
"examples/*.py" = ["T201"] # tutorials print their narrative on purpose

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests", "benchmarks", "examples"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the fast, deterministic CI gate; stochastic learning
# canaries are opted into explicitly with `pytest -m slow`.
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: long-running stochastic learning canaries (run with -m slow)",
]
